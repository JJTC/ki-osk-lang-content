# Language packs: what a device installs. `make packs` turns this file into
# one manifest per pack (see crates/osk-data/src/pack.rs) under dist/packs/.
#
# Every predict/<id>.fst + predict/<id>.ngram.bin pair is a pack of its own,
# with the [prediction] licence and source below, so it needs only a name.
# The input-method packs are listed in full further down.
#
# make-packs refuses a committed data file that no pack claims, and a
# language with files but no name here, so nothing ships unlisted.

[prediction]
license = { name = "CC BY 2.0 FR", url = "https://creativecommons.org/licenses/by/2.0/fr/", share_alike = false }
source  = { name = "Tatoeba", url = "https://tatoeba.org/" }

[prediction.names]
ar  = "Arabic"
as  = "Assamese"
az  = "Azerbaijani"
be  = "Belarusian"
bg  = "Bulgarian"
bn  = "Bengali"
br  = "Breton"
ca  = "Catalan"
cs  = "Czech"
da  = "Danish"
de  = "German"
el  = "Greek"
en  = "English"
eo  = "Esperanto"
es  = "Spanish"
et  = "Estonian"
eu  = "Basque"
fa  = "Persian"
fi  = "Finnish"
fil = "Filipino"
fr  = "French"
gl  = "Galician"
he  = "Hebrew"
hi  = "Hindi"
hr  = "Croatian"
hu  = "Hungarian"
hy  = "Armenian"
id  = "Indonesian"
is  = "Icelandic"
it  = "Italian"
ka  = "Georgian"
kab = "Kabyle"
ku  = "Kurdish (Kurmanji)"
lt  = "Lithuanian"
lv  = "Latvian"
mk  = "Macedonian"
mr  = "Marathi"
ms  = "Malay"
nl  = "Dutch"
no  = "Norwegian (Bokmål)"
oc  = "Occitan"
os  = "Ossetian"
pl  = "Polish"
pt  = "Portuguese"
ro  = "Romanian"
ru  = "Russian"
