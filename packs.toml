# The tables whose costs `make fit-translit` fitted to how people
# romanized a dataset's words, and that dataset: their packs name it for
# that too. Dakshina's training words (Gujarati's and Kannada's tables
# stayed as written); Aksharantar's words romanized by hand and
# Wikidata's names (Assamese's, Nepali's and Odia's stayed as written;
# Meitei's in the Bengali script on its Meetei Mayek words respelled,
# make aksharantar-respelled).
[[translit.fitted]]
license = { name = "CC BY-SA 4.0 (the Dakshina dataset)", url = "https://creativecommons.org/licenses/by-sa/4.0/", share_alike = true }
source  = { name = "The Dakshina dataset v1.0 (Google Research): romanization lexicons, the transliteration table's costs fitted to them", url = "https://github.com/google-research-datasets/dakshina" }
langs   = ["bn", "hi", "ml", "mr", "pa", "sd", "si", "ta", "te", "ur"]

[[translit.fitted]]
license = { name = "CC BY (Aksharantar's manually collected data)", url = "https://huggingface.co/datasets/ai4bharat/Aksharantar#licensing-information", share_alike = false }
source  = { name = "The Aksharantar dataset (AI4Bharat): words romanized by hand and Wikidata's names, the transliteration table's costs fitted to them", url = "https://huggingface.co/datasets/ai4bharat/Aksharantar" }
langs   = ["brx", "doi", "kok", "ks", "mai", "mni", "mni-Beng", "sa"]

# The tables of languages neither dataset has, fitted to Dakshina's
# romanizations of the words they share with Hindi, Urdu, Kannada,
# Telugu, Marathi or Bengali (make fit-translit's FIT_BORROWED; Sindhi's
# in Devanagari, Bagri's, Mandeali's, Surjapuri's and Bishnupriya's
# stayed as written, Gondi's at Telugu's fitted costs, Angika's at
# Hindi's). Named, and no
# licence added: the tables hold the numbers learned, none of the
# dataset's words, and Chhattisgarhi's, Brahui's, Garhwali's and
# Rajasthani's packs are not otherwise share-alike.
[[translit.fitted]]
source  = { name = "The Dakshina dataset v1.0 (Google Research): romanization lexicons of Hindi, Urdu, Kannada, Telugu, Marathi or Bengali, the transliteration table's costs fitted to the words they share with this language", url = "https://github.com/google-research-datasets/dakshina" }
langs   = ["ahr", "anp", "awa", "bfy", "bgq", "bho", "bns", "bpy", "brh", "dty", "gbm", "hlb", "hne", "kfq", "kfy", "khw", "kru", "mag", "mjl", "new", "noe", "pnb", "raj", "rkt", "sjp", "skr", "tcy", "wsg"]

# The English words a language with a table writes in its script, which
# people type as English spells them (translit/<lang>.english.txt, `make
# english-assets`): how CMUdict says each word, spelled in Latin letters as
# the language's sounds are typed and read by its table, kept where its
# lexicon has the reading. Each joins its language's pack beside the
# table, where the lexicon's licence already is.
[translit.english]
license = { name = "BSD-2-Clause-style notice (CMUdict)", url = "https://github.com/cmusphinx/cmudict/blob/74790861f652b15e4ac49015a90074ad62a27690/LICENSE", share_alike = false }
source  = { name = "The CMU Pronouncing Dictionary (cmusphinx/cmudict at 74790861f652): how English says its words, spelled and read by the language's transliteration table", url = "https://github.com/cmusphinx/cmudict" }

# Keyboard layouts (layouts/<id>.json): the keys of each, and what each
# types. The national ones are read from xkeyboard-config's keymaps
# through libxkbcommon (scripts/build-layout.py, build-national-grid.py,
# relabel-layout.py, relabel-national.py); the keyboard uploads the same
# keymap, named in a layout's `xkb_layout`. A language's layouts join its
# pack, which then carries this licence and source besides its own; the
# emoji picker's layout is the emoji pack's, from Unicode's data.
