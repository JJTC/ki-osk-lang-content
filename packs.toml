# The dialect flags (predict/<lang>.dialects.bin: which varieties of a
# language use a word, and its spellings across them) of the languages
# that have them, with the licences and sources they add to those
# languages' packs. make-packs refuses a table with no entry here.
[prediction.dialects.en]
licenses = [
  { name = "ESDB permission notice (Kevin Atkinson)", url = "https://github.com/en-wl/wordlist/blob/v2/Copyright", share_alike = false },
  { name = "Apache-2.0 (Harper's dictionary)", url = "https://www.apache.org/licenses/LICENSE-2.0", share_alike = false },
]
sources = [
  { name = "English Speller Database (SCOWLv2)", url = "https://github.com/en-wl/wordlist", lock = "dialects/en", input = "esdb-scowl-pre.txt" },
  { name = "Harper's English dictionary (harper-core 3.0.0)", url = "https://github.com/automattic/harper", lock = "dialects/en", input = "harper-dictionary.dict" },
]

[prediction.dialects.pt]
licenses = [
  { name = "CC BY-SA 4.0 (Wiktionary)", url = "https://creativecommons.org/licenses/by-sa/4.0/", share_alike = true },
]
sources = [
  { name = "Wiktionary's Portuguese entries, as extracted by kaikki.org", url = "https://kaikki.org/dictionary/Portuguese/", lock = "dialects/pt", input = "kaikki-pt.jsonl.gz" },
]

[prediction.dialects.es]
licenses = [
  { name = "CC BY-SA 4.0 (Wiktionary)", url = "https://creativecommons.org/licenses/by-sa/4.0/", share_alike = true },
]
sources = [
  { name = "Wiktionary's Spanish entries, as extracted by kaikki.org", url = "https://kaikki.org/dictionary/Spanish/", lock = "dialects/es", input = "kaikki-es.jsonl.gz" },
]

# The word lists of the languages written without spaces between words
# (wordbreak/<lang>.txt, scripts/fetch-word-lists.sh), which cut their
# text into words in the trainer, the keyboard and the measure, with the
# licences and sources they add to those languages' packs. make-packs
# refuses a list with no entry here.
[prediction.wordbreak.th]
licenses = [
  { name = "Unicode License v3", url = "https://www.unicode.org/license.txt", share_alike = false },
  { name = "ICU License (ICU 1.8.1 to 57.1)", url = "https://github.com/unicode-org/icu/blob/release-79.1/LICENSE", share_alike = false },
]
sources = [
  { name = "ICU's Thai word-break dictionary (thaidict.txt, ICU 79.1)", url = "https://github.com/unicode-org/icu/blob/release-79.1/icu4c/source/data/brkitr/dictionaries/thaidict.txt", lock = "predict/th", input = "wordbreak/th.txt" },
]

# Wikipedia text of twelve South Asian languages, as the Dakshina dataset
# gives it (scripts/fetch-dakshina.sh): the whole corpus of Gujarati,
# Kannada, Malayalam, Punjabi, Sindhi, Sinhala, Tamil, Telugu and Urdu,
# and half of Hindi's, Bengali's and Marathi's beside Tatoeba's; with its
# romanization lexicons, Hinglish's (hi-Latn: Hindi's corpora respelled in
# Latin letters, scripts/build-hinglish.py). A pack names the corpora
# sources.lock records its model was built from, with their licences:
# Tatoeba's ([prediction]), this, or both.
[prediction.dakshina]
license = { name = "CC BY-SA 4.0 (the Dakshina dataset)", url = "https://creativecommons.org/licenses/by-sa/4.0/", share_alike = true }
source  = { name = "The Dakshina dataset v1.0 (Google Research): Wikipedia text", url = "https://github.com/google-research-datasets/dakshina" }

# Transliteration tables (translit/<lang>.txt, osk_data::translit): how the
# Latin letters typed for a language become its script, written for this
# repository. Each joins the pack of its language, beside the layout that
# types through it (layouts/<lang>-abc.json, [layouts.packs]).
[translit]
license = { name = "MIT (the transliteration tables)", url = "https://opensource.org/license/mit", share_alike = false }
source  = { name = "ki-osk-lang-content's transliteration tables", url = "https://github.com/jjtc/ki-osk-lang-content/tree/main/translit" }

# Keyboard layouts (layouts/<id>.json): the keys of each, and what each
# types. The national ones are read from xkeyboard-config's keymaps
# through libxkbcommon (scripts/build-layout.py, build-national-grid.py,
# relabel-layout.py, relabel-national.py); the keyboard uploads the same
# keymap, named in a layout's `xkb_layout`. A language's layouts join its
# pack, which then carries this licence and source besides its own; the
# emoji picker's layout is the emoji pack's, from Unicode's data.
[layouts]
license = { name = "MIT/X11-style notices (xkeyboard-config)", url = "https://gitlab.freedesktop.org/xkeyboard-config/xkeyboard-config/-/blob/master/COPYING", share_alike = false }
source  = { name = "xkeyboard-config, read through libxkbcommon", url = "https://gitlab.freedesktop.org/xkeyboard-config/xkeyboard-config" }

