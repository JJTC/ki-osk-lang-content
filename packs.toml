# Wikipedia text of twelve South Asian languages, as the Dakshina dataset
# gives it (scripts/fetch-dakshina.sh): the whole corpus of Gujarati,
# Kannada, Malayalam, Punjabi, Sindhi, Sinhala, Tamil, Telugu and Urdu,
# and half of Hindi's, Bengali's and Marathi's beside Tatoeba's; with its
# romanization lexicons, Hinglish's (hi-Latn: Hindi's corpora respelled in
# Latin letters, scripts/build-hinglish.py). A pack names the corpora
# sources.lock records its model was built from, with their licences:
# Tatoeba's ([prediction]), this, or both.
[prediction.dakshina]
license = { name = "CC BY-SA 4.0 (the Dakshina dataset)", url = "https://creativecommons.org/licenses/by-sa/4.0/", share_alike = true }
source  = { name = "The Dakshina dataset v1.0 (Google Research): Wikipedia text", url = "https://github.com/google-research-datasets/dakshina" }

# The wikis' own text (scripts/fetch-wikipedia.sh: their CirrusSearch
# dumps, plain text, pinned by sha256): the whole corpus of the languages
# that script names, the Wikimedia Incubator's test wikis among them
# (Gondi's, Khowar's, and Magahi's beside its FineWeb-2 text).
[prediction.wikipedia]
license = { name = "CC BY-SA 4.0 (Wikipedia)", url = "https://creativecommons.org/licenses/by-sa/4.0/", share_alike = true }
source  = { name = "Wikipedia and the Wikimedia Incubator's test wikis, their CirrusSearch dumps of 2026-11-08", url = "https://dumps.wikimedia.org/other/cirrus_search_index/20261108/" }

# FineWeb-2's web text (scripts/fetch-fineweb.sh: its parquet files at one
# revision, pinned by sha256; scripts/fineweb-text.py keeps the documents
# that read as their language): the whole corpus of the languages, and
# the second scripts of languages, with no Wikipedia of their own that
# script names, and Assamese's beside its Tatoeba sentences. ODC-By asks
# that what is made from it say so: each such pack names it, and
# NOTICES.md.
[prediction.fineweb]
license = { name = "ODC-By 1.0 (FineWeb-2)", url = "https://opendatacommons.org/licenses/by/1-0/", share_alike = false }
source  = { name = "FineWeb-2 (Hugging Face): web text from Common Crawl, revision af9c133", url = "https://huggingface.co/datasets/HuggingFaceFW/fineweb-2" }

# MADLAD-400's web text (scripts/fetch-madlad.sh: its files at one
# revision, pinned by sha256; scripts/fineweb-text.py keeps the documents
# that read as their language): the whole corpus of Garhwali and
# Rajasthani. Its card releases it under CC BY 4.0 (its metadata says
# ODC-By); either asks that what is made from it say so.
[prediction.madlad]
license = { name = "CC BY 4.0 (MADLAD-400)", url = "https://creativecommons.org/licenses/by/4.0/", share_alike = false }
source  = { name = "MADLAD-400 (Google; allenai/MADLAD-400 at Hugging Face): web text from Common Crawl, revision 9d886a7", url = "https://huggingface.co/datasets/allenai/MADLAD-400" }

# GlotCC's web text (scripts/fetch-glotcc.sh: its files at one revision,
# pinned by sha256; scripts/fineweb-text.py keeps the documents that read
# as their language): Newari's news, beside its wiki's text, and Nigerian
# Pidgin's, beside FineWeb-2's (the sentences it lacks). Its card
# licenses its packaging, metadata and annotations CC0 1.0, the text
# being under Common Crawl's Terms of Use; the packs name it all the same.
[prediction.glotcc]
license = { name = "CC0 1.0 (GlotCC's packaging; the text under Common Crawl's Terms of Use)", url = "https://creativecommons.org/publicdomain/zero/1.0/", share_alike = false }
source  = { name = "GlotCC v1.0 (cis-lmu/GlotCC-V1 at Hugging Face): web text from Common Crawl, revision 9ad140b", url = "https://huggingface.co/datasets/cis-lmu/GlotCC-V1" }

# Transliteration tables (translit/<lang>.txt, osk_data::translit): how the
# Latin letters typed for a language become its script, written for this
# repository. Each joins the pack of its language, beside the layout that
# types through it (layouts/<lang>-abc.json, [layouts.packs]).
[translit]
license = { name = "MIT (the transliteration tables)", url = "https://opensource.org/license/mit", share_alike = false }
source  = { name = "ki-osk-lang-content's transliteration tables", url = "https://github.com/jjtc/ki-osk-lang-content/tree/main/translit" }

# The tables whose costs `make fit-translit` fitted to how people
# romanized a dataset's words, and that dataset: their packs name it for
# that too. Dakshina's training words (Gujarati's and Kannada's tables
# stayed as written); Aksharantar's words romanized by hand and
# Wikidata's names (Assamese's, Nepali's and Odia's stayed as written).
[[translit.fitted]]
license = { name = "CC BY-SA 4.0 (the Dakshina dataset)", url = "https://creativecommons.org/licenses/by-sa/4.0/", share_alike = true }
source  = { name = "The Dakshina dataset v1.0 (Google Research): romanization lexicons, the transliteration table's costs fitted to them", url = "https://github.com/google-research-datasets/dakshina" }
langs   = ["bn", "hi", "ml", "mr", "pa", "sd", "si", "ta", "te", "ur"]

[[translit.fitted]]
license = { name = "CC BY (Aksharantar's manually collected data)", url = "https://huggingface.co/datasets/ai4bharat/Aksharantar#licensing-information", share_alike = false }
source  = { name = "The Aksharantar dataset (AI4Bharat): words romanized by hand and Wikidata's names, the transliteration table's costs fitted to them", url = "https://huggingface.co/datasets/ai4bharat/Aksharantar" }
langs   = ["brx", "doi", "kok", "ks", "mai", "mni", "sa"]

# The tables of languages neither dataset has, fitted to Dakshina's
# romanizations of the words they share with Hindi, Urdu, Kannada or
# Telugu (make fit-translit's FIT_BORROWED; Sindhi's in Devanagari
# stayed as written, Gondi's at Telugu's fitted costs, Angika's at
# Hindi's). Named, and no
# licence added: the tables hold the numbers learned, none of the
# dataset's words, and Chhattisgarhi's, Brahui's, Garhwali's and
# Rajasthani's packs are not otherwise share-alike.
[[translit.fitted]]
source  = { name = "The Dakshina dataset v1.0 (Google Research): romanization lexicons of Hindi, Urdu, Kannada or Telugu, the transliteration table's costs fitted to the words they share with this language", url = "https://github.com/google-research-datasets/dakshina" }
langs   = ["anp", "awa", "bho", "brh", "dty", "gbm", "hne", "khw", "mag", "new", "pnb", "raj", "skr", "tcy", "wsg"]

# The English words a language with a table writes in its script, which
# people type as English spells them (translit/<lang>.english.txt, `make
# english-assets`): how CMUdict says each word, spelled in Latin letters as
# the language's sounds are typed and read by its table, kept where its
# lexicon has the reading. Each joins its language's pack beside the
# table, where the lexicon's licence already is.
[translit.english]
license = { name = "BSD-2-Clause-style notice (CMUdict)", url = "https://github.com/cmusphinx/cmudict/blob/74790861f652b15e4ac49015a90074ad62a27690/LICENSE", share_alike = false }
source  = { name = "The CMU Pronouncing Dictionary (cmusphinx/cmudict at 74790861f652): how English says its words, spelled and read by the language's transliteration table", url = "https://github.com/cmusphinx/cmudict" }

# Keyboard layouts (layouts/<id>.json): the keys of each, and what each
# types. The national ones are read from xkeyboard-config's keymaps
# through libxkbcommon (scripts/build-layout.py, build-national-grid.py,
# relabel-layout.py, relabel-national.py); the keyboard uploads the same
# keymap, named in a layout's `xkb_layout`. A language's layouts join its
# pack, which then carries this licence and source besides its own; the
# emoji picker's layout is the emoji pack's, from Unicode's data.
[layouts]
license = { name = "MIT/X11-style notices (xkeyboard-config)", url = "https://gitlab.freedesktop.org/xkeyboard-config/xkeyboard-config/-/blob/master/COPYING", share_alike = false }
source  = { name = "xkeyboard-config, read through libxkbcommon", url = "https://gitlab.freedesktop.org/xkeyboard-config/xkeyboard-config" }

