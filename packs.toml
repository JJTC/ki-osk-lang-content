  { name = "Shan's syllables in FineWeb-2's text (revision af9c133), as build-syllables lists them", url = "https://huggingface.co/datasets/HuggingFaceFW/fineweb-2", lock = "predict/shn", input = "wordbreak/shn.txt" },
]

