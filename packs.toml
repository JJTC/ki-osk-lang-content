# The wikis' own text (scripts/fetch-wikipedia.sh: their CirrusSearch
# dumps, plain text, pinned by sha256): the whole corpus of the languages
# that script names, the Wikimedia Incubator's test wikis among them
# (Gondi's, Khowar's, Montenegrin's, fourteen small ones' from Rinconada
# Bikol's to Abron's, Vai's, and Magahi's beside its FineWeb-2 text).
[prediction.wikipedia]
license = { name = "CC BY-SA 4.0 (Wikipedia)", url = "https://creativecommons.org/licenses/by-sa/4.0/", share_alike = true }
source  = { name = "Wikipedia and the Wikimedia Incubator's test wikis, their CirrusSearch dumps of 2026-11-08", url = "https://dumps.wikimedia.org/other/cirrus_search_index/20261108/" }

# FineWeb-2's web text (scripts/fetch-fineweb.sh: its parquet files at one
# revision, pinned by sha256; scripts/fineweb-text.py keeps the documents
# that read as their language): the whole corpus of the languages, and
# the second scripts of languages, with no Wikipedia of their own that
# script names, and Assamese's beside its Tatoeba sentences. ODC-By asks
# that what is made from it say so: each such pack names it, and
# NOTICES.md.
[prediction.fineweb]
license = { name = "ODC-By 1.0 (FineWeb-2)", url = "https://opendatacommons.org/licenses/by/1-0/", share_alike = false }
source  = { name = "FineWeb-2 (Hugging Face): web text from Common Crawl, revision af9c133", url = "https://huggingface.co/datasets/HuggingFaceFW/fineweb-2" }

# MADLAD-400's web text (scripts/fetch-madlad.sh: its files at one
# revision, pinned by sha256; scripts/fineweb-text.py keeps the documents
# that read as their language): the whole corpus of Garhwali and
# Rajasthani, Krio, Tandroy-Mahafaly Malagasy, Hawu, Kituba and Ayacucho
# Quechua. Its card releases it under CC BY 4.0 (its metadata says
# ODC-By); either asks that what is made from it say so.
[prediction.madlad]
license = { name = "CC BY 4.0 (MADLAD-400)", url = "https://creativecommons.org/licenses/by/4.0/", share_alike = false }
source  = { name = "MADLAD-400 (Google; allenai/MADLAD-400 at Hugging Face): web text from Common Crawl, revision 9d886a7", url = "https://huggingface.co/datasets/allenai/MADLAD-400" }

# The African Storybook's stories (scripts/fetch-storybooks.sh: the Global
# African Storybook Project's asp-raw-db archive at one commit, pinned by
# sha256; scripts/storybook-text.py reads the CC BY ones): the whole
# corpus of Masaaba and Turkana. Each story is CC BY 3.0 or 4.0, its
# author and illustrator named in its file there; NOTICES.md says so.
[prediction.storybooks]
license = { name = "CC BY 4.0 (the African Storybook's stories, each CC BY 3.0 or 4.0)", url = "https://creativecommons.org/licenses/by/4.0/", share_alike = false }
source  = { name = "The African Storybook (africanstorybook.org, Saide): its stories as the Global African Storybook Project's asp-raw-db keeps them, commit 096a27f", url = "https://github.com/global-asp/asp-raw-db" }

# StoryWeaver's stories (scripts/fetch-storyweaver.sh: the stories named
# in scripts/storyweaver-stories.tsv, each pinned by the sha256 of its
# text, read through the site's reader with an account;
# scripts/storyweaver-text.py reads them): the whole corpus of the
# languages in the Makefile's STORYWEAVER_LANGS. Each story is CC BY 4.0,
# its author, translator, illustrator and publisher named on its page
# there; NOTICES.md says so.
[prediction.storyweaver]
license = { name = "CC BY 4.0 (StoryWeaver's stories)", url = "https://creativecommons.org/licenses/by/4.0/", share_alike = false }
source  = { name = "StoryWeaver (storyweaver.org.in, Pratham Books): its stories, those scripts/storyweaver-stories.tsv names", url = "https://storyweaver.org.in/" }

# SMOL's translations (scripts/fetch-smol.sh: google/smol's files at one
# revision, pinned by sha256; scripts/smol-text.py reads them): the whole
# corpus of the languages in the Makefile's SMOL_LANGS. Professional
# translations of English text, released by Google Research under
# CC BY 4.0, which asks that what is made from them say so.
[prediction.smol]
license = { name = "CC BY 4.0 (SMOL)", url = "https://creativecommons.org/licenses/by/4.0/", share_alike = false }
source  = { name = "SMOL (Google Research; google/smol at Hugging Face): professional translations, SmolDoc and SmolSent, revision fdaff3a", url = "https://huggingface.co/datasets/google/smol" }

# GlotCC's web text (scripts/fetch-glotcc.sh: its files at one revision,
# pinned by sha256; scripts/fineweb-text.py keeps the documents that read
# as their language): Newari's news, beside its wiki's text, and Nigerian
# Pidgin's, beside FineWeb-2's (the sentences it lacks). Its card
# licenses its packaging, metadata and annotations CC0 1.0, the text
# being under Common Crawl's Terms of Use; the packs name it all the same.
[prediction.glotcc]
license = { name = "CC0 1.0 (GlotCC's packaging; the text under Common Crawl's Terms of Use)", url = "https://creativecommons.org/publicdomain/zero/1.0/", share_alike = false }
