# The layouts made from another source than xkeyboard-config, and the
# licence and source each adds to its pack: Sgaw Karen's, from Keyman's
# sil_sgaw_karen, Northwestern Ojibwe's, from Keyman's fv_ojibwa, the
# thirteen of a script of their own from Keyman's, Chakma's to Osage's,
# and six more from Keyman's at a later commit, Gorani's to Northern
# Thai's in Tai Tham and Sylheti's in Syloti Nagri, and the IPA's, SIL's
# sil_ipa on the US keys
# (scripts/build-keyman-layouts.py), and Vai's and
# Nuosu's, the Latin letters Keyman's athinkra_vai and sil_yi type their
# syllables with (scripts/build-keyman-composers.py); and the fifty-seven
# whose letters are CLDR's exemplar characters
# (scripts/build-exemplar-layouts.py): thirty-two in Latin letters, Afar's
# to Zarma's and Adamawa Fulfulde's and Bench's, and twenty-five on the
# Arabic script's, Devanagari's and Bengali's keys, Balti's to Sylheti's;
# and Southern Balochi's, made from Balochi's, and Dari's, Persian's keys
# with the letters CLDR's Dari adds.
[layouts.added.ksw]
licenses = [
  { name = "MIT (Keyman's sil_sgaw_karen, SIL Global)", url = "https://github.com/keymanapp/keyboards/blob/7225701d383cf8317f595bfd73481fcd87524f44/release/sil/sil_sgaw_karen/LICENSE.md", share_alike = false },
]
sources = [
  { name = "Keyman's Sgaw Karen keyboard (sil_sgaw_karen 1.1.3), its touch layout", url = "https://github.com/keymanapp/keyboards/tree/7225701d383cf8317f595bfd73481fcd87524f44/release/sil/sil_sgaw_karen" },
]

