# eBible.org's Bibles (scripts/fetch-ebible.sh: each translation's verses
# pinned by sha256; scripts/ebible-text.py cuts them into sentences): the
# whole corpus of the languages that script names, and Gamo's beside its
# web text. Each is under its own copyright and CC BY-SA 4.0, as its about
# page says, which asks that what is made from it name its holders and its
# source and be shared alike, but Gamo's New Testament, CC BY 4.0, which
# asks the first two (a Bible's own `license`): each pack names its Bibles,
# below, and NOTICES.md what was done to them.
