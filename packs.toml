# `lock`/`input` name the sources.lock entry and input whose recorded
# sha256 the manifest carries, so a pack names the exact upstream file it
# was built from.

# The text rules, written here: what typing a key does to the text before
# the caret beyond typing it, for every language and for the languages
# with rules of their own (crates/osk-data/src/rules.rs). MIT, as the code.
[[pack]]
id   = "rules"
name = "Text rules, every language"
components = [
  { kind = "rules", path = "rules/all.weir" },
  { kind = "rules", path = "rules/cs.weir" },
  { kind = "rules", path = "rules/da.weir" },
  { kind = "rules", path = "rules/de.weir" },
  { kind = "rules", path = "rules/fi.weir" },
  { kind = "rules", path = "rules/fr.weir" },
  { kind = "rules", path = "rules/is.weir" },
  { kind = "rules", path = "rules/lt.weir" },
  { kind = "rules", path = "rules/mk.weir" },
  { kind = "rules", path = "rules/oc.weir" },
  { kind = "rules", path = "rules/sk.weir" },
  { kind = "rules", path = "rules/sv.weir" },
]
licenses = [
  { name = "MIT", url = "https://opensource.org/license/mit", share_alike = false },
]
sources = [
  { name = "ki-osk-lang-content", url = "https://github.com/jjtc/ki-osk-lang-content" },
]

# The Pinyin syllable inventory (from CC-CEDICT's readings) and the
# double-Pinyin schemes (the schemes' published key mappings) are tables
# of facts, written here; see NOTICES.md.
[[pack]]
id   = "zh-Hans"
name = "Chinese (Simplified), Pinyin input"
components = [
  { kind = "pinyin", path = "pinyin/cedict.bin" },
  { kind = "syllables", path = "pinyin/syllables.txt" },
  { kind = "double-pinyin", path = "pinyin/double-pinyin.json" },
]
licenses = [
  { name = "CC BY-SA 4.0", url = "https://creativecommons.org/licenses/by-sa/4.0/", share_alike = true },
  { name = "MIT (the syllable inventory and the double-Pinyin tables)", url = "https://opensource.org/license/mit", share_alike = false },
]
sources = [
  { name = "CC-CEDICT", url = "https://www.mdbg.net/chinese/dictionary?page=cc-cedict", lock = "pinyin", input = "cedict.txt" },
  { name = "FrequencyWords zh_cn (candidate order only)", url = "https://github.com/hermitdave/FrequencyWords", lock = "pinyin", input = "zh_cn_50k.txt" },
  { name = "The double-Pinyin schemes' published key mappings (小鹤, 微软, 自然码, 智能ABC, 紫光, 拼音加加)", url = "https://zh.wikipedia.org/wiki/%E5%8F%8C%E6%8B%BC" },
]

[[pack]]
id   = "zh-Hant"
name = "Chinese (Traditional), Zhuyin input"
components = [{ kind = "zhuyin", path = "zhuyin/cedict.bin" }]
licenses = [
  { name = "CC BY-SA 4.0", url = "https://creativecommons.org/licenses/by-sa/4.0/", share_alike = true },
]
sources = [
  { name = "CC-CEDICT", url = "https://www.mdbg.net/chinese/dictionary?page=cc-cedict", lock = "zhuyin", input = "cedict.txt" },
  { name = "FrequencyWords zh_cn (candidate order only)", url = "https://github.com/hermitdave/FrequencyWords", lock = "zhuyin", input = "zh_cn_50k.txt" },
]

[[pack]]
id   = "yue"
name = "Cantonese, Jyutping input"
components = [{ kind = "jyutping", path = "jyutping/cedict.bin" }]
licenses = [
  { name = "CC BY-SA 3.0 (CC-Canto readings, © 2015 Pleco Software)", url = "https://creativecommons.org/licenses/by-sa/3.0/", share_alike = true },
  { name = "CC BY-SA 4.0 (CC-CEDICT portions)", url = "https://creativecommons.org/licenses/by-sa/4.0/", share_alike = true },
]
sources = [
  { name = "CC-Canto Cantonese readings for CC-CEDICT", url = "https://cantonese.org/download.html", lock = "jyutping", input = "cccedict-canto-readings.txt" },
  { name = "FrequencyWords zh_cn (candidate order only)", url = "https://github.com/hermitdave/FrequencyWords", lock = "jyutping", input = "zh_cn_50k.txt" },
]

[[pack]]
id   = "ja"
name = "Japanese, kana-kanji conversion"
components = [
  { kind = "kanji", path = "kana/mozc-kanji.bin" },
  { kind = "connection", path = "kana/mozc-connection.bin" },
]
licenses = [
  { name = "BSD-3-Clause", url = "https://github.com/google/mozc/blob/master/LICENSE", share_alike = false },
]
sources = [
  { name = "mozc OSS system dictionary", url = "https://github.com/google/mozc", lock = "kana/mozc-kanji", input = "mozc-dict.tsv" },
  { name = "mozc connection matrix", url = "https://github.com/google/mozc", lock = "kana/mozc-connection", input = "mozc-connection.txt" },
]

# The emoji picker: its layout (a curated grid, scripts/gen-emoji-layout.py)
# and its search catalogue (every fully-qualified emoji with its CLDR name
# and keywords, scripts/build-emoji.py), both from Unicode's data.
[[pack]]
id   = "emoji"
name = "Emoji picker and search"
components = [
  { kind = "layout", path = "layouts/emoji.json" },
  { kind = "emoji", path = "emoji/catalogue.json" },
]
licenses = [
  { name = "Unicode License v3", url = "https://www.unicode.org/license.txt", share_alike = false },
]
sources = [
  { name = "Unicode emoji data (emoji-test.txt, Emoji 16.0)", url = "https://unicode.org/Public/emoji/16.0/emoji-test.txt" },
  { name = "CLDR annotations, English (annotations and annotationsDerived, taken 2026-07-17)", url = "https://github.com/unicode-org/cldr/tree/main/common/annotations" },
]

