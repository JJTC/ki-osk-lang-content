# Shan's, Mon's, Sgaw Karen's and Pa'O's are their syllables, those their
# FineWeb-2 text writes twice or more (build-syllables, `make
# syllable-lists`): no list of their words is to be had, so each syllable
# is a word to the trainer, the keyboard and the measure. Arakanese's and
# Eastern Pwo Karen's are those their wikis write.
[prediction.wordbreak.shn]
licenses = [
  { name = "ODC-By 1.0 (FineWeb-2)", url = "https://opendatacommons.org/licenses/by/1-0/", share_alike = false },
]
